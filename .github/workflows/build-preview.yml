name: Build Bloom Preview (Windows)

on:
  push:
    branches:
      - essai-notches-sans-bandes
      - correctif-recherche-ajout-dock
      - bloom-3-recherche-tray-chatgpt
      - fix-tray-chevron-fallback
      - test/bloom-3-tray-arrow-fix
    paths:
      - ".github/workflows/build-preview.yml"
      - "src-tauri/src/services.rs"
      - "src-tauri/src/commands.rs"
      - "src-tauri/src/main.rs"
      - "src-tauri/src/state.rs"
      - "src-tauri/src/utils.rs"
      - "src/Dock.tsx"
      - "public/brand-clean-whatsapp.svg"
      - "public/brand-clean-chatgpt.svg"
      - "src-tauri/src/tray.rs"
      - "src/Dock.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    name: Vérification et exécutable Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Mettre le cache Rust en place
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Vérifier la compilation du frontend
        run: bun run build

      - name: Tester le dock et les régions des fenêtres
        run: bun test ./scripts

      - name: Vérifier Rust
        run: cargo check --locked
        working-directory: src-tauri

      - name: Vérifier Clippy
        run: cargo clippy --locked --all-targets
        working-directory: src-tauri

      - name: Tester Rust
        run: cargo test --locked
        working-directory: src-tauri

      - name: Construire Bloom sans installateur
        run: bun run tauri build --no-bundle --ci

      - name: Archiver uniquement l'application de test
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-3-Preview-Windows
          path: src-tauri/target/release/bloom.exe
          if-no-files-found: error
          retention-days: 7
